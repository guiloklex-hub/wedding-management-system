name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android APK e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar e testar APK
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:assembleRelease --console=plain

      - name: Testar conversor web
        run: |
          python -m pip install 'cryptography==50.0.1'
          python -m unittest discover -s android/tools -p 'test_*.py'
          python android/tools/generate_portable_fixture.py /tmp/portable-v2-fixture.wfpbackup
          cmp /tmp/portable-v2-fixture.wfpbackup android/app/src/androidTest/assets/portable-v2-fixture.wfpbackup

      - name: APK de depuração
        uses: actions/upload-artifact@v4
        with:
          name: wedding-planner-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  test:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Testes
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "file:./ci.db"
          NEXTAUTH_SECRET: "ci-placeholder-secret-not-used-in-runtime"
          NEXTAUTH_URL: "http://localhost:3005"
